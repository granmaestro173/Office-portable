name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OP_VERSION_CODE: ${{ github.run_number }}
      OP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Read editor version
        id: editor
        run: echo "ref=$(cat scripts/EDITOR_REF)" >> "$GITHUB_OUTPUT"

      - name: Cache editor bundle
        id: bundle-cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/www
          key: editor-bundle-${{ steps.editor.outputs.ref }}-${{ hashFiles('scripts/build-editor.sh', 'scripts/patch-editor.py', 'scripts/fill-font-faces.py') }}

      - name: Set up Node.js
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Build offline editor bundle
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-editor.sh

      - name: Check editor bundle
        run: |
          test -f android/app/src/main/assets/www/editor.html
          test -f android/app/src/main/assets/www/web-apps/apps/api/documents/api.js
          test -f android/app/src/main/assets/www/sdkjs/common/wasm/x2t/x2t.wasm.br
          du -sh android/app/src/main/assets/www

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.OP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No OP_KEYSTORE_B64 secret; the APK is signed with a throwaway debug key."
          fi

      - name: Build APK
        env:
          OP_KEYSTORE_PASSWORD: ${{ secrets.OP_KEYSTORE_PASSWORD }}
          OP_KEY_ALIAS: ${{ secrets.OP_KEY_ALIAS }}
          OP_KEY_PASSWORD: ${{ secrets.OP_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/OfficePortable-$OP_VERSION_NAME.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: OfficePortable-${{ env.OP_VERSION_NAME }}
          path: out/*.apk
          compression-level: 0

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$OP_VERSION_NAME"
          gh release create "$TAG" out/*.apk \
            --title "Office Portable $OP_VERSION_NAME" \
            --notes "Download the APK below and open it on your Android phone or tablet to install. Built from ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"

  # Installs the APK on an Android 14 emulator, walks through the main screens
  # (including a real two-finger pinch in a presentation) and keeps screenshots.
  # Informational: it never blocks the release above.
  screens:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      OP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OfficePortable-${{ env.OP_VERSION_NAME }}
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: test/device/ui-check.sh "$(ls apk/*.apk | head -1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ env.OP_VERSION_NAME }}
          path: screens/

      # Also on a branch, so they can be browsed on GitHub without downloading.
      - name: Publish screenshots to the ci-screens branch
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d screens ] || exit 0
          cd screens
          { echo "# Screens for $OP_VERSION_NAME (${GITHUB_SHA::7})"; echo;
            for f in *.png; do echo "## ${f%.png}"; echo; echo "<img src=\"$f\" width=\"300\">"; echo; done; } > README.md
          git init -q -b ci-screens
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Screens for $OP_VERSION_NAME"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens
